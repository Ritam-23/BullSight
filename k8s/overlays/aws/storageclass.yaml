# gp3 EBS via the AWS EBS CSI driver. Requires the driver add-on installed on the cluster
# (see DEPLOY.md). WaitForFirstConsumer places the volume in the same AZ as the pod.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain  # keep the data volume if the PVC is deleted
allowVolumeExpansion: true
