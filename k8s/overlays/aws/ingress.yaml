# Internet-facing ALB via the AWS Load Balancer Controller (must be installed — see DEPLOY.md).
# HTTP only by default (no domain). To add HTTPS: attach an ACM cert and add the 443 annotations
# (commented below), then point Route53 at the ALB and switch FRONTEND_URL to https://.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bullsight
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    # --- HTTPS (uncomment once you have an ACM cert + domain) ---
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT:certificate/XXXX
    # alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
