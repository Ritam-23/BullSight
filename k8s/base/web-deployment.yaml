apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: bullsight
    component: web
spec:
  replicas: 2  # stateless — safe to scale horizontally
  selector:
    matchLabels:
      app: bullsight
      component: web
  template:
    metadata:
      labels:
        app: bullsight
        component: web
    spec:
      containers:
        - name: web
          image: bullsight-web:latest  # overridden per-overlay
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: web-config
            - secretRef:
                name: web-secret
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 25
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
