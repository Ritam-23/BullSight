# TEMPLATE — copy to web-secret.yaml (gitignored) and fill in. SMTP for the receipt email.
#   cp k8s/base/web-secret.example.yaml k8s/base/web-secret.yaml
# Gmail: SMTP_USER = your address, SMTP_PASS = a 16-char App Password
# (https://myaccount.google.com/apppasswords). Leave blank to disable emailing.
apiVersion: v1
kind: Secret
metadata:
  name: web-secret
type: Opaque
stringData:
  SMTP_HOST: "smtp.gmail.com"
  SMTP_USER: ""
  SMTP_PASS: ""
  SMTP_FROM: "BullSight <you@example.com>"
