# TEMPLATE — copy to api-secret.yaml (gitignored) and fill in. Never commit real secrets.
#   cp k8s/base/api-secret.example.yaml k8s/base/api-secret.yaml
# Generate a session secret:
#   python -c "import secrets;print(secrets.token_urlsafe(48))"
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
type: Opaque
stringData:
  SESSION_SECRET: "REPLACE_WITH_LONG_RANDOM_STRING"
  # Optional OAuth (needs a public https domain + registered redirect URIs to work):
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  # Optional Stripe (test mode):
  STRIPE_SECRET_KEY: ""
  STRIPE_PUBLISHABLE_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
