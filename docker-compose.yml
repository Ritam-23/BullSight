# Local end-to-end test of the containerized stack. Mirrors the Kubernetes topology:
#   browser -> web (Next.js, published on :3000) -> api (FastAPI, internal only)
# Run:  cp .env.compose.example .env  &&  docker compose up --build
name: bullsight

services:
  api:
    build:
      context: ./backend
    environment:
      # CORS + cookie security are derived from FRONTEND_URL. http:// keeps cookies non-Secure
      # so login works over plain HTTP locally.
      FRONTEND_URL: "http://localhost:3000"
      SESSION_SECRET: "${SESSION_SECRET:-dev-only-secret-change-me}"
      ALLOW_DEMO_LOGIN: "${ALLOW_DEMO_LOGIN:-true}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
    volumes:
      # Persist SQLite DB, avatars, cached listings, session secret across restarts.
      - api-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Server-side only: the Next proxy + /receipt route reach the API over the compose network.
      BACKEND_URL: "http://api:8000"
      # SMTP for the purchase-receipt email (leave blank to disable emailing).
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  api-data:
